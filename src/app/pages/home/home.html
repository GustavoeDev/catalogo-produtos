<div class="products-grid">
  @for (product of catalogView(); track product.id) {
    <app-product-card
      variant="catalog"
      [productId]="product.id"
      [name]="product.name"
      [description]="product.description"
      [image]="product.image"
      [price]="product.price"
      [originalPrice]="product.originalPrice ?? 0"
      [availableStock]="product.availableStock"
      (add)="addOne($event)"
    />
  }
</div>
